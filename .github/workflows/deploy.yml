name: 사이트 검증 및 배포

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.163.3
  HUGO_ENVIRONMENT: production
  TZ: Asia/Seoul

jobs:
  build:
    name: 빌드와 링크 검증
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v7
      - name: 고 언어 도구 준비
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - name: 노드 도구 준비
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: 휴고 확장판 준비
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: 잠금 파일에 맞춰 의존성 설치
        run: npm ci --include=dev
      - name: 사이트 빌드
        run: npm run build
      - name: 한국어 콘텐츠와 배포 경로 검증
        run: npm run check
      - name: 배포할 파일 업로드
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: 사이트 게시
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 페이지 배포 설정 확인
        uses: actions/configure-pages@v5
      - name: 검증된 사이트 게시
        id: deployment
        uses: actions/deploy-pages@v4
