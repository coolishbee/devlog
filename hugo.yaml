# 저장소 하위 경로를 포함한 실제 배포 주소입니다.
baseURL: https://coolishbee.github.io/devlog/
title: "James's Devlog"
locale: ko-KR
timeZone: Asia/Seoul
defaultContentLanguage: ko
defaultContentLanguageInSubdir: false
enableEmoji: true
enableRobotsTXT: true

module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static
      target: static
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

languages:
  ko:
    locale: ko-KR
    label: 한국어
    title: "James's Devlog"
    weight: 1

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

caches:
  images:
    dir: :cacheDir/images

params:
  background: /images/site/background.jpg
  logo:
    main: /images/site/main-logo.png
    inverted: /images/site/inverted-logo.png
    favicon: /images/site/favicon.png
  gitRepo: https://github.com/coolishbee/devlog
  gitBranch: main
  topNavbar:
    maxVisibleSections: 5
  features:
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: system
    portfolio:
      enable: true
    blog:
      enable: true
      showAuthor: true
      shareButtons:
        facebook: true
        twitter: true
        linkedin: true
        reddit: true
        whatsapp: true
        email: true
    notes:
      enable: true
    # 별도 계정 설정이 필요한 서비스는 사용하지 않습니다.
    comment:
      enable: false
    analytics:
      enable: false
    support:
      enable: false
    toc:
      enable: true
    tags:
      enable: true
      on_card: true
    flags:
      enable: false
    embedpdf:
      enable: true
    flowchart:
      enable: true
      services:
        mermaid:
          theme: forest
    math:
      enable: true
      services:
        katex:
          delimiters:
            - left: $$
              right: $$
              display: true
            - left: \\[
              right: \\]
              display: true
            - left: $
              right: $
              display: false
            - left: \\(
              right: \\)
              display: false
    syntaxHighlight:
      enable: true
      services:
        hljs:
          noHighlightRe: /^no-highlight$/i
    videoPlayer:
      enable: true
      services:
        plyr: {}
    copyCodeButton:
      enable: true
    readingTime:
      enable: false
    pagination:
      maxPostsPerPage: 12
  footer:
    enable: true
    template: footer.html
    navigation:
      enable: true
      customMenus: true
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: true
