{{ with .Paginator }}
  {{ if gt .TotalPages 1 }}
    <nav aria-label="Post pagination">
      <ul class="pagination justify-content-center">
        {{ if .HasPrev }}
          <li class="page-item"><a class="page-link" href="{{ .First.URL }}" aria-label="First page">First</a></li>
          <li class="page-item"><a class="page-link" href="{{ .Prev.URL }}" aria-label="Previous page">Previous</a></li>
        {{ end }}
        {{ $current := .PageNumber }}
        {{ range .Pagers }}
          <li class="page-item{{ if eq .PageNumber $current }} active{{ end }}">
            <a class="page-link" href="{{ .URL }}" aria-label="Page {{ .PageNumber }}"{{ if eq .PageNumber $current }} aria-current="page"{{ end }}>{{ .PageNumber }}</a>
          </li>
        {{ end }}
        {{ if .HasNext }}
          <li class="page-item"><a class="page-link" href="{{ .Next.URL }}" aria-label="Next page">Next</a></li>
          <li class="page-item"><a class="page-link" href="{{ .Last.URL }}" aria-label="Last page">Last</a></li>
        {{ end }}
      </ul>
    </nav>
  {{ end }}
{{ end }}
