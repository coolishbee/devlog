{{- $id := "" -}}
{{- if .IsNamedParams -}}
  {{- $id = .Get "id" -}}
{{- else -}}
  {{- $id = .Get 0 -}}
{{- end -}}
<div class="ratio ratio-16x9">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ $id }}?hl=ko&amp;cc_lang_pref=ko" title="유튜브 동영상" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>
