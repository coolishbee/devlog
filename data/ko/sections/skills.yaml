skills:
  - name: "Git"
    logo: /images/sections/skills/git.png
    summary: "Git 기반으로 소스를 관리하며 GitHub와 GitLab을 사용한 개발 경험이 있습니다."
    categories: [basic]
    url: https://git-scm.com/
  - name: "Docker"
    logo: /images/sections/skills/docker.svg
    summary: "애플리케이션을 컨테이너로 구성합니다. 다단계 빌드와 다중 아키텍처 빌드 경험이 있습니다."
    categories: [basic]
    url: https://www.docker.com/
  - name: "C"
    logo: /images/sections/skills/c.svg
    summary: "C 언어의 기본 문법을 이해하고 프로그래밍에 활용한 경험이 있습니다."
    categories: [language]
  - name: "C++"
    logo: /images/sections/skills/c++.png
    summary: "PC·모바일 게임 개발에 사용했습니다. 게임 엔진과 Windows 환경에서 개발한 경험이 있습니다."
    categories: [language]
  - name: "C#"
    logo: /images/sections/skills/csharp.svg
    summary: "Unity 기반 게임과 공용 SDK를 개발하며, 네이티브 기능을 연결하는 인터페이스를 구현했습니다."
    categories: [language]
  - name: "Objective-C"
    logo: /images/sections/skills/objective-c.svg
    summary: "iOS 네이티브 기능과 SDK를 개발하고 Unity와 연동하는 작업에 사용했습니다."
    categories: [language]
  - name: "Go Development"
    logo: /images/sections/skills/go.png
    summary: "SDK API 서버와 사내 관리 도구 개발에 사용했습니다. 데이터 처리와 외부 서비스 연동 경험이 있습니다."
    categories: [language]
    url: https://golang.org/
  - name: "Swift"
    logo: /images/sections/skills/swift.svg
    summary: "iOS SDK 개발에 사용했습니다. 네트워크 통신과 플랫폼 기능 연동, 테스트 코드를 구현했습니다."
    categories: [language]
  - name: "Kotlin"
    logo: /images/sections/skills/kotlin.svg
    summary: "Android SDK 개발에 사용했습니다. 인증·결제·푸시 등 공통 기능과 네트워크 통신을 구현했습니다."
    categories: [language]
  - name: "Unity"
    logo: /images/sections/skills/unity.svg
    summary: "모바일 게임과 공용 SDK를 개발했습니다. Android·iOS 네이티브 연동과 빌드 자동화 경험이 있습니다."
    categories: [engine]
  - name: "Cocos2d-x"
    logo: /images/sections/skills/cocos2d-x.svg
    summary: "C++ 기반 게임 개발에 Cocos2d-x를 활용한 경험이 있습니다."
    categories: [engine]
    url: https://github.com/cocos2d/cocos2d-x
  - name: "Jenkins"
    logo: /images/sections/skills/jenkins.svg
    summary: "게임과 SDK의 빌드·배포를 자동화했습니다. 에셋번들 빌드와 게임 운영 작업 자동화 경험이 있습니다."
    categories: [tools]
  - name: "fastlane"
    logo: /images/sections/skills/fastlane.svg
    summary: "모바일 SDK와 앱의 반복적인 빌드·배포 작업을 자동화하고 Jenkins와 연동했습니다."
    categories: [tools]
  - name: "Grafana"
    logo: /images/sections/skills/grafana.svg
    summary: "Grafana와 Loki로 서버 로그 모니터링 환경을 구축했습니다. 서비스별 로그 검색과 시각화, Docker Compose 기반 환경 구성 경험이 있습니다."
    categories: [tools]
    url: https://grafana.com/
  - name: "Android"
    logo: /images/sections/skills/android.svg
    summary: "인증·결제·푸시 기능을 갖춘 네이티브 SDK를 개발했습니다. Unity 연동과 라이브러리 배포 경험이 있습니다."
    categories: [others]
  - name: "iOS"
    logo: /images/sections/skills/ios.svg
    summary: "인증·결제·푸시 기능을 갖춘 네이티브 SDK를 개발했습니다. Unity 연동과 SDK 배포 경험이 있습니다."
    categories: [others]
  - name: "Cloud Computing"
    logo: /images/sections/skills/cloud.png
    summary: "GCP, AWS, Azure 등 주요 클라우드 서비스를 사용한 경험이 있습니다."
    categories: [others]
