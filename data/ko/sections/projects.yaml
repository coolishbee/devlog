section:
  name: Open-source
  id: projects
  enable: true
  weight: 5
  showOnNavbar: true

buttons:
  - name: All
    filter: all
  - name: Unity
    filter: unity
  - name: Go
    filter: go

projects:
  - name: Universal SDK Unity
    role: Owner
    repo: https://github.com/coolishbee/universal-sdk-unity
    summary: |
      - 소셜 로그인(Google, Facebook, Apple)
      - 안드로이드(CustomTabView), iOS(SafariViewController)
      - [유니티 에셋스토어 출시](https://assetstore.unity.com/packages/slug/204843)
      - [Universal SDK Android](https://github.com/coolishbee/universal-sdk-android)
      - [Universal SDK iOS](https://github.com/coolishbee/universal-sdk-ios)
    tags: [unity, sdk, open-source]

  - name: simple debug console
    role: Owner
    repo: https://github.com/coolishbee/simple-debug-console-unity
    summary: |
      - 모바일 해상도에 맞게 리사이즈
      - 제스처 지원(스크롤, 열기)
      - Portrait, Landscape 지원
      - 16:9, 9:16 고정비율
      - [유니티 에셋스토어 출시](https://assetstore.unity.com/packages/slug/228001)
    tags: [unity, tool, open-source]

  - name: simple http client
    role: Owner
    repo: https://github.com/coolishbee/simple-http-client-unity
    summary: |
      - GET, POST, PUT, PATCH 제공
      - 성공, 실패, 네트워크 에러 이벤트 처리
      - 이미지 다운로드 제공
      - 다양한 예제 제공
    tags: [unity, network, open-source]

  - name: go iap onestore
    role: Owner
    repo: https://github.com/coolishbee/go-iap-onestore
    summary: |
      - OAuth 인증
      - 결제 영수증 검증
    tags: [go, iap, open-source]

  - name: go iap playstore
    role: Owner
    repo: https://github.com/coolishbee/go-iap-playstore
    summary: |
      - OAuth 인증
      - 환불목록 조회 API
    tags: [go, iap, open-source]

  - name: GoogleUserMessagingPlatform
    role: Contributor
    repo: https://github.com/binouze/GoogleUserMessagingPlatform
    summary: Unity 프로젝트의 iOS와 Android에서 Google AdMob User Messaging Platform을 사용할 수 있도록 제공하는 간단한 구현입니다.
    tags: [unity, ios, android, open-source]
