projects:
  - name: Universal SDK Unity
    role: 제작자
    repo: https://github.com/coolishbee/universal-sdk-unity
    summary: 소셜 로그인 등 여러 외부 라이브러리를 하나의 인터페이스로 통합한 Unity SDK입니다. Google·Facebook·Apple 로그인과 Android Custom Tabs, iOS Safari View Controller를 지원하며 Unity Asset Store에 출시했습니다.
    tags: [unity, sdk, open-source]

  - name: Simple Debug Console
    role: 제작자
    repo: https://github.com/coolishbee/simple-debug-console-unity
    summary: ImGui를 이용한 Unity 런타임 로그 뷰어입니다. 모바일 해상도 대응, 스크롤·열기 제스처, 가로·세로 화면과 고정 비율을 지원하며 Unity Asset Store에 출시했습니다.
    tags: [unity, tool, open-source]

  - name: Simple HTTP Client
    role: 제작자
    repo: https://github.com/coolishbee/simple-http-client-unity
    summary: UniTask 기반 Unity HTTP 클라이언트입니다. GET, POST, PUT, PATCH 요청과 성공·실패·네트워크 오류 처리, 이미지 다운로드 및 다양한 예제를 제공합니다.
    tags: [unity, network, open-source]

  - name: Go IAP OneStore
    role: 제작자
    repo: https://github.com/coolishbee/go-iap-onestore
    summary: 원스토어 서버 API를 위한 Go 라이브러리로 OAuth 인증과 인앱 결제 영수증 검증을 지원합니다.
    tags: [go, iap, open-source]

  - name: Go IAP PlayStore
    role: 제작자
    repo: https://github.com/coolishbee/go-iap-playstore
    summary: Google Play 서버 API를 위한 Go 라이브러리로 OAuth 인증과 환불 목록 조회를 지원합니다.
    tags: [go, iap, open-source]
