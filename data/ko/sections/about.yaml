summary: >-
  여러 해의 실무 경험을 가진 열정적인 소프트웨어 엔지니어입니다.
  고 언어로 [쿠버네티스](https://kubernetes.io/)를 위한 오픈 소스 도구를 만들었습니다.
  제가 만든 도구는 사람들이 쿠버네티스에 애플리케이션을 배포하는 데 도움을 줍니다.
  때로는 테마 제작처럼 재미있는 프로젝트를 진행하기도 합니다.
