  PC·모바일 게임 개발과 Android, iOS, Unity SDK 개발 경험을 쌓아온 소프트웨어 엔지니어입니다.
  일상에서도 개발 관점으로 사용자의 불편을 발견하고 개선하는 일을 좋아하며, 새로운 기술과 흐름을 즐깁니다.
  팀 협업과 커뮤니케이션을 중요하게 생각하고, 과거의 경험이 서로 연결되어 현재를 만든다는
  ‘연결된 점’의 가치를 믿습니다. 필요한 단 한 사람에게라도 도움이 되는 도구를 만들고자
  오픈 소스 프로젝트를 꾸준히 개발하고 있습니다.

