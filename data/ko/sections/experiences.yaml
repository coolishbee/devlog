section:
  name: 경력
  id: experiences
  enable: true
  weight: 3
  showOnNavbar: true

experiences:
  - company:
      name: 111퍼센트
      overview: 유니티·안드로이드·iOS 기반 공용 개발 도구와 게임 프레임워크를 설계하고 운영합니다.
    positions:
      - designation: 플랫폼 클라이언트 개발자
        start: 2024년 8월
        responsibilities:
          - 111퍼센트 게임 전반에서 사용하는 공용 SDK와 재사용 가능한 게임 프레임워크를 설계하고 개발합니다.
          - 인증, 결제, 광고, 로깅, 빌드 및 패키지 모듈을 개발하고 유니티 최적화와 기술 지원을 담당합니다.
          - 유니티 앱 링크·유니버설 링크 지원 공용 패키지를 개발하고 [딥링크 빌드 문제를 분석하고 해결했습니다](posts/unity/unity-deeplink/).
          - 유니티·안드로이드·iOS를 지원하는 통합 플랫폼 SDK를 설계·개발하고 운영합니다.
          - 인증·결제·푸시 등 게임 공통 기능과 플랫폼 연동 모듈을 개발하고, 유니티와 네이티브 간 연동 구조 및 공통 인터페이스를 설계합니다.
          - 운영체제·단말·유니티 버전별 호환성 문제에 대응하며 [안드로이드 16KB 페이지 크기를 지원하도록 네이티브 라이브러리를 개선했습니다](posts/unity/android-16kb-page-size/).
          - 개발 도구의 빌드·배포·버전 관리와 하위 호환성을 유지하고 지속적으로 품질을 개선합니다.
          - 운빨존많겜·협동타워디펜스의 빌드 장애에 대응하고 배포 안정화를 통해 배포 신뢰성을 높였습니다.
          - FCM 기반 클라이언트·서버 공용 모듈을 개발하고 푸시 API를 연동했습니다.

  - company:
      name: 게임펍
      url: https://gamepub.co.kr
      overview: 게임 서비스를 위한 안드로이드·iOS·유니티 개발 도구와 사내 운영 도구를 개발했습니다.
    positions:
      - designation: SDK 개발자
        start: 2020년 3월
        end: 2023년 7월
        responsibilities:
          - 안드로이드·iOS·유니티용 [게임펍 SDK를 설계하고 개발했습니다](posts/project/gamepub-sdk/).
          - 구글·페이스북·애플 로그인과 구글 플레이·앱스토어·원스토어·갤럭시 스토어 결제를 연동했습니다.
          - FCM·APNs 푸시와 [Retrofit2·코루틴](https://github.com/coolishbee/retrofit2-coroutine-example), [Alamofire](https://github.com/coolishbee/AlamofireExample) 기반 네트워크 계층을 개발했습니다.
          - '[유니티 패키지 내보내기 도구](https://github.com/coolishbee/unity-export-package-tool)와 [SDK 사용 가이드](https://docs.igamepub.co.kr/)를 제작했습니다.'
          - '[패스트레인과 젠킨스를 이용한 SDK 배포 자동화](posts/project/jenkins-sdk-build-deploy/)와 [유니티 기반 빌드 머신](posts/unity/unity-build-machine-shell/)을 구축했습니다.'
          - 안드로이드 SDK의 [제이센터 배포](posts/android/jcenter/)와 [메이븐 배포](posts/android/maven-deploy/) 체계를 구축했습니다.
          - '[게임 서비스 스케줄러](posts/project/jenkins-python/), [광고 수익 보고서](posts/project/ad-report-admin/), [마케팅 지표 관리 도구](posts/project/adjust-data-admin/) 등 사내 백오피스를 개발했습니다.'

  - company:
      name: 프리랜서
      url: https://youtu.be/1voJ_RI_h1k
      overview: 5G 기반 자율주행 무인 경비 로봇의 원격 제어 솔루션을 개발했습니다.
    positions:
      - designation: 소프트웨어 엔지니어
        start: 2019년 11월
        end: 2020년 1월
        responsibilities:
          - OpenCV DLL과 C++·C# 간 인터페이스 및 데이터 변환 계층을 설계하고 개발했습니다.
          - API 검증용 C# WinForms 도구와 멀티스레드 영상 스트리밍 시스템을 개발했습니다.
          - Unity 기반 다중 모니터 카메라 뷰, 로봇 체험, 시스템 제어 프로그램을 개발했습니다.
          - 소켓 통신, HUD, 미니맵, Google Maps Static API와 360도 카메라 스트리밍을 연동했습니다.

  - company:
      name: 뮤엠교육
      url: https://mumenglish.com
      overview: Unity 기반 교육용 모바일 앱과 교사용 PC 프로그램을 개발했습니다.
    positions:
      - designation: Unity 개발자
        start: 2017년 9월
        end: 2019년 7월
        responsibilities:
          - 뮤고박스 Android 앱과 교사용 Unity Standalone 프로그램을 개발했습니다.
          - 뮤고스쿨 Android 네이티브·Unity 앱과 C# WinForms 교사용 프로그램을 개발하고 유지보수했습니다.
          - NSIS 배포 시스템과 Jenkins 기반 APK·에셋 번들 자동 빌드를 구축했습니다.
          - 에셋·데이터·카메라·네트워크 시스템과 3D 캐릭터 및 환경을 개발했습니다.
          - WebRTC 기반 소환 수업과 HTTP, Socket, WebSocket 통신을 구현했습니다.

  - company:
      name: Valofe
      url: https://valofe.com
      overview: Unity 기반 온라인 게임의 글로벌 서비스와 빌드·배포 시스템을 담당했습니다.
    positions:
      - designation: Unity 개발자
        start: 2017년 3월
        end: 2017년 9월
        responsibilities:
          - 삼국지를 품다의 Google Play, App Store, 원스토어, WebPlayer 빌드와 배포를 담당했습니다.
          - 대만 현지화와 신규 출시를 진행하고 MyCard를 연동했습니다.
          - Jenkins Slave Node 기반 Unity iOS 빌드 자동화를 구축했습니다.
          - HTTP Manager, iOS 심사용 서버 전환, 웹뷰 상점과 결제 관리자를 개발했습니다.
          - 개발·스테이지·라이브 Git 브랜치를 통합했습니다.

  - company:
      name: YJM Games
      url: https://yjmgames.com
      overview: Unity 모바일 게임의 현지화, SDK 연동, 빌드 자동화와 시스템 리팩터링을 담당했습니다.
    positions:
      - designation: Unity 개발자
        start: 2016년 7월
        end: 2017년 1월
        responsibilities:
          - 캡슐풋볼매니저의 이란 현지화와 Bazaar 출시를 진행했습니다.
          - 현지 마켓 SDK를 연동하고 데이터 및 UI 시스템을 리팩터링했습니다.
          - Jenkins 기반 Unity 빌드 자동화를 구축했습니다.
          - 게임 콘텐츠와 캐릭터 제작 도구를 개발했습니다.

  - company:
      name: Picneko Creative
      url: https://www.softnyx.co.kr
      overview: Unity 모바일 게임의 글로벌 빌드·배포, 콘텐츠와 운영 도구를 개발했습니다.
    positions:
      - designation: Unity 개발자
        start: 2015년 4월
        end: 2016년 3월
        responsibilities:
          - 워스토리와 킹덤스토리의 Android·iOS 빌드 배포 및 라이브 서비스를 담당했습니다.
          - Hudson 빌드 시스템을 유지보수하고 Jenkins 기반 에셋 번들 빌드를 자동화했습니다.
          - Python으로 dSYM 파일 업로드 스크립트를 개발했습니다.
          - Kochava, Amazon Appstore·IAP·ADM·GameCircle, Facebook, GPGS SDK를 연동했습니다.
          - 워스토리를 호주·북미의 Android, iOS, Amazon 마켓에 출시하고 텍스처를 최적화했습니다.

  - company:
      name: BH Games
      overview: C++ 기반 온라인 게임의 국내·글로벌 서비스와 현지화를 담당했습니다.
    positions:
      - designation: 글로벌 현지화 개발자
        start: 2013년 8월
        end: 2014년 8월
        responsibilities:
          - 불패온라인의 국내 라이브 서비스와 태국 출시를 담당했습니다.
          - 잭팟, 일대일 대전, 아이템 교환 시스템을 개발했습니다.
          - 태국 현지화와 패치 시스템을 구현했습니다.
          - 운영 도구를 개발하고 유지보수했습니다.

  - company:
      name: L&K Logic Korea
      url: https://logickorea.co.kr
      overview: C++와 DirectX 기반 온라인 게임 클라이언트 및 UI 시스템을 개발했습니다.
    positions:
      - designation: 클라이언트 프로그래머
        start: 2012년 3월
        end: 2013년 5월
        responsibilities:
          - 붉은보석2 온라인 신규 개발에 참여했습니다.
          - 툴팁, 스킬 UI, 시스템 옵션과 드롭 아이템을 개발했습니다.
          - UI 엔진과 제작 도구를 개선했습니다.
          - Actor, Player, NPC 관리 구조와 플레이어 이동 동기화를 개발했습니다.
