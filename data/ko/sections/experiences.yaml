  description: "<mark>custom opencv sdk 플러그인 개발</mark>\n- opencv dll 프로젝트에 연동\n- c++, c# 간에 통신하는 Interface 및 Data Convert 설계 및 개발            \n- 테스트용 c# winform 툴 개발(유니티에서 사용하기전 API TEST)            \n- c++ 쓰레드 구현.\n- opencv API 를 활용한 영상 스트리밍 시스템 구현.\n\n<mark>유니티 카메라뷰 프로그램</mark>\n- GUI(다중 모니터 활성화를 위한 UGUI Canvas 작업)\n- 소켓 통신 클라이언트 개발\n- custom opencv sdk 플러그인 연동\n- 영상 스트리밍 시스템\n- 다중 모니터 활성화 기능 구현\n\n<mark>유니티 로봇체험 프로그램</mark>\n- GUI(HUD)\n- 소켓 통신 클라이언트 개발\n- User Controller\n- custom opencv sdk 플러그인 연동\n- 영상 스트리밍 시스템\n- 360카메라 스트리밍 연동\n\n<mark>유니티 시스템제어 프로그램</mark>\n- GUI(미니맵 및 로봇상태, 로그 출력)\n- 소켓 통신 클라이언트 개발\n- google map static api 연동\n"
