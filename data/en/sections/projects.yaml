section:
  name: Open Source
  id: projects
  enable: true
  weight: 5
  showOnNavbar: true

buttons:
  - name: All
    filter: all
  - name: Unity
    filter: unity
  - name: Go
    filter: go

projects:
  - name: Universal SDK Unity
    role: Creator
    repo: https://github.com/coolishbee/universal-sdk-unity
    summary: A Unity SDK that provides a unified interface for third-party libraries. It supports Google, Facebook, and Apple sign-in, Android Custom Tabs, and iOS Safari View Controller, and is available on the Unity Asset Store.
    tags: [unity, sdk, open-source]

  - name: Simple Debug Console
    role: Creator
    repo: https://github.com/coolishbee/simple-debug-console-unity
    summary: An ImGui-based runtime log viewer for Unity. It supports mobile resolutions, scroll and open gestures, portrait and landscape modes, and fixed aspect ratios, and is available on the Unity Asset Store.
    tags: [unity, tool, open-source]

  - name: Simple HTTP Client
    role: Creator
    repo: https://github.com/coolishbee/simple-http-client-unity
    summary: A UniTask-based HTTP client for Unity with GET, POST, PUT, and PATCH requests, success and failure handling, network error events, image downloads, and practical examples.
    tags: [unity, network, open-source]

  - name: Go IAP OneStore
    role: Creator
    repo: https://github.com/coolishbee/go-iap-onestore
    summary: A Go library for the OneStore server API that supports OAuth authentication and in-app purchase receipt validation.
    tags: [go, iap, open-source]

  - name: Go IAP PlayStore
    role: Creator
    repo: https://github.com/coolishbee/go-iap-playstore
    summary: A Go library for the Google Play server API that supports OAuth authentication and retrieval of refunded purchases.
    tags: [go, iap, open-source]
